#
# SPI
#
CONFIG_SPI=y
CONFIG_SPI_PL022=y

#
# This exercise uses synchronous polling
#
CONFIG_SPI_PL022_INTERRUPT=n
CONFIG_SPI_PL022_DMA=n
CONFIG_SPI_ASYNC=n

#
# Required by the PL022 clock path
#
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_FIXED_RATE_CLOCK=y
CONFIG_PINCTRL=y

#
# SPI is owned by this lab
#
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_SERIAL=n

#
# Debug-friendly build
#
CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_ASSERT=y

#
# Runtime
#
CONFIG_MAIN_STACK_SIZE=2048
