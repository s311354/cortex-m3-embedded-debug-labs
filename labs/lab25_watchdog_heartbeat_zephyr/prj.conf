#
# The CMSDK driver routes its first expiration through the runtime NMI handler
#
CONFIG_WATCHDOG=y
CONFIG_RUNTIME_NMI=y
CONFIG_WDOG_CMSDK_APB=y
CONFIG_WDOG_CMSDK_APB_START_AT_BOOT=n

# Sparse progress messages
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n

#
# Real threads and GDB-friendly code
#
CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_ASSERT=y

#
# Runtime
#
CONFIG_MAIN_STACK_SIZE=2048

# MPS2 already has a watchdog device
CONFIG_QEMU_EXTRA_FLAGS="-action watchdog=reset"
