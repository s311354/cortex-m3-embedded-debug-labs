#
# I2C
#
CONFIG_I2C=y
CONFIG_I2C_SBCON=y

#
# Application receive queue
#
CONFIG_RING_BUFFER=y

#
# I2C is owned by this lab
#
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n

# QEMU-only target for the lab21 register-access test
CONFIG_QEMU_EXTRA_FLAGS="-device at24c-eeprom,id=lab21_regs,bus=/versatile_i2c/i2c,address=0x2a,rom-size=256,address-size=1,writable=on"


#
# Debug-friendly build
#
CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_ASSERT=y

#
# Runtime
#
CONFIG_MAIN_STACK_SIZE=2048
