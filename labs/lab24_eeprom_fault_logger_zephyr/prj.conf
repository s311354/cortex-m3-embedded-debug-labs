#
# I2C and EEPROM drivers
#
CONFIG_I2C=y
CONFIG_I2C_SBCON=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y
CONFIG_PINCTRL=y

# Sparse progress messages
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n

#
# Real threads and GDB-friendly code
#
CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_ASSERT=y

#
# Runtime
#
CONFIG_MAIN_STACK_SIZE=2048
