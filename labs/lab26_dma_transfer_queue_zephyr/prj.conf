#
# The CMSDK driver routes its first expiration through the runtime NMI handler
#
CONFIG_DMA=y

# Sparse progress messages
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n

#
# Real threads and GDB-friendly code
#
CONFIG_DEBUG=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_ASSERT=y

#
# Runtime
#
CONFIG_MAIN_STACK_SIZE=2048
